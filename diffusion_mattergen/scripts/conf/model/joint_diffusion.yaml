defaults:
  - common/geometry@_here_
  - _self_

_target_: src.diffusion.joint_diffusion.JointDiffusion
atom_corruption:
  _target_: src.diffusion.corruption.AtomTypeCorruption
  atom_types: ${model.denoiser.atom_types}
  scheduler:
    _target_: src.diffusion.scheduler.MaskScheduler
    timesteps: 1000
loss_fn:
  _target_: src.diffusion.loss.JointDiffusionLoss
  atom_weight: 1.0
  d3pm_hybrid_lambda: 0.01
  timesteps: ${model.atom_corruption.scheduler.timesteps}
  num_atom_types: ${model.denoiser.atom_types}

defaults:
  - dataloader: default
  - model: joint_diffusion
  - resume: default
  - _self_

# Optional joint checkpoint for initializing a fresh CSP run.
init_checkpoint: null

# Relative paths start at the directory where training is launched.
data:
  input: data_cache/mp_20_mattergen
  output: output/${now:%Y-%m-%d}/${now:%H-%M-%S-%f}
  batchsize: 64  # Global training batch target, divided by the GPU count for multi-GPU runs.

trainer:
  seed: 42
  device: cuda
  devices: 1  # Number of consecutive GPUs when gpu_ids is null.
  # CUDA-visible indices in rank order, e.g. [2] or [1, 3].
  # The list overrides devices and any index in device.
  gpu_ids: null
  max_epochs: 1000
  max_steps: null
  check_gradients: true
  gradient_clip_val: 0.5     # Set to 0 or null to disable clipping.
  gradient_clip_algorithm: value  # value or norm
  t_min: 1.0e-5              # Lower bound for uniform time sampling in training and validation.

optimizer:
  _target_: torch.optim.Adam
  _partial_: true
  _convert_: all
  lr: 1.0e-4
  betas: [0.9, 0.999]
  eps: 1.0e-8
  weight_decay: 0.0

# Monitors validation loss each epoch. Set lr_scheduler=null to disable it.
lr_scheduler:
  _target_: torch.optim.lr_scheduler.ReduceLROnPlateau
  _partial_: true
  _convert_: all
  mode: min
  factor: 0.6
  patience: 40
  threshold: 1.0e-3
  threshold_mode: rel
  cooldown: 0
  min_lr: 1.0e-6
  eps: 1.0e-8

hydra:
  job:
    chdir: false
  run:
    dir: ${data.output}
  sweep:
    dir: ${data.output}
    subdir: ${hydra.job.num}

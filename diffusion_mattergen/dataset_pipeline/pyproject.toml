[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mask-diff-crystal-dataset"
version = "0.1.0"
description = "CIF storage and PyTorch batches for periodic crystal structures"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pymatgen>=2024.5.1", "torch>=2.1"]

[project.scripts]
crystal-dataset = "crystal_dataset.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["crystal_dataset*"]
